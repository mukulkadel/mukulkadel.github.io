---
layout: app
title: Unit Converter
permalink: /apps/unit-converter/
description: Convert length, weight, temperature, and data storage units instantly in your browser.
---

<p style="color:var(--text-muted);margin-bottom:1.5rem;">
  Pick a category, then convert live as you type. Everything runs locally in your browser.
</p>

<div style="display:flex;gap:0.5rem;margin-bottom:1.5rem;flex-wrap:wrap;">
  <button class="btn" id="catLengthBtn" type="button">Length</button>
  <button class="btn btn-outline" id="catWeightBtn" type="button">Weight</button>
  <button class="btn btn-outline" id="catTempBtn" type="button">Temperature</button>
  <button class="btn btn-outline" id="catDataBtn" type="button">Data Storage</button>
</div>

<div style="display:flex;gap:1rem;align-items:flex-end;flex-wrap:wrap;">
  <label style="display:flex;flex-direction:column;font-size:0.8rem;color:var(--text-muted);gap:0.3rem;">
    Value
    <input type="number" id="valueInput" value="1" style="width:150px;padding:0.5rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text);font-family:var(--font-mono);">
  </label>
  <label style="display:flex;flex-direction:column;font-size:0.8rem;color:var(--text-muted);gap:0.3rem;">
    From
    <select id="fromUnit" style="padding:0.5rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text);"></select>
  </label>
  <button class="btn btn-outline" id="swapBtn" type="button">⇄</button>
  <label style="display:flex;flex-direction:column;font-size:0.8rem;color:var(--text-muted);gap:0.3rem;">
    To
    <select id="toUnit" style="padding:0.5rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text);"></select>
  </label>
</div>

<div id="result" class="tool-output" style="font-size:1.3rem;text-align:center;padding:1.5rem;margin-top:1.5rem;"></div>

<h2>All Units</h2>
<div id="allResults" class="tool-output" style="max-height:300px;"></div>

<script>
(function () {
  var CATEGORIES = {
    length: {
      base: 'm',
      units: { mm: 0.001, cm: 0.01, m: 1, km: 1000, in: 0.0254, ft: 0.3048, yd: 0.9144, mi: 1609.344 },
      labels: { mm: 'Millimeters', cm: 'Centimeters', m: 'Meters', km: 'Kilometers', in: 'Inches', ft: 'Feet', yd: 'Yards', mi: 'Miles' }
    },
    weight: {
      base: 'g',
      units: { mg: 0.001, g: 1, kg: 1000, oz: 28.3495, lb: 453.592, t: 1000000 },
      labels: { mg: 'Milligrams', g: 'Grams', kg: 'Kilograms', oz: 'Ounces', lb: 'Pounds', t: 'Metric tons' }
    },
    data: {
      base: 'B',
      units: { B: 1, KB: 1024, MB: Math.pow(1024, 2), GB: Math.pow(1024, 3), TB: Math.pow(1024, 4) },
      labels: { B: 'Bytes', KB: 'Kilobytes', MB: 'Megabytes', GB: 'Gigabytes', TB: 'Terabytes' }
    },
    temp: {
      units: { C: 1, F: 1, K: 1 },
      labels: { C: 'Celsius', F: 'Fahrenheit', K: 'Kelvin' }
    }
  };

  function toCelsius(v, unit) {
    if (unit === 'C') return v;
    if (unit === 'F') return (v - 32) * 5 / 9;
    return v - 273.15;
  }

  function fromCelsius(c, unit) {
    if (unit === 'C') return c;
    if (unit === 'F') return c * 9 / 5 + 32;
    return c + 273.15;
  }

  function convert(category, value, fromUnit, toUnit) {
    if (category === 'temp') {
      return fromCelsius(toCelsius(value, fromUnit), toUnit);
    }
    var def = CATEGORIES[category];
    var baseValue = value * def.units[fromUnit];
    return baseValue / def.units[toUnit];
  }

  var catButtons = {
    length: document.getElementById('catLengthBtn'),
    weight: document.getElementById('catWeightBtn'),
    temp: document.getElementById('catTempBtn'),
    data: document.getElementById('catDataBtn')
  };
  var valueInput = document.getElementById('valueInput');
  var fromUnit = document.getElementById('fromUnit');
  var toUnit = document.getElementById('toUnit');
  var swapBtn = document.getElementById('swapBtn');
  var result = document.getElementById('result');
  var allResults = document.getElementById('allResults');

  var currentCategory = 'length';

  function populateUnits() {
    var def = CATEGORIES[currentCategory];
    var keys = Object.keys(def.units);
    fromUnit.innerHTML = keys.map(function (k) { return '<option value="' + k + '">' + def.labels[k] + ' (' + k + ')</option>'; }).join('');
    toUnit.innerHTML = fromUnit.innerHTML;
    fromUnit.selectedIndex = 0;
    toUnit.selectedIndex = keys.length > 1 ? 1 : 0;
  }

  function formatNumber(n) {
    if (!isFinite(n)) return String(n);
    if (Math.abs(n) >= 1e9 || (Math.abs(n) < 1e-6 && n !== 0)) return n.toExponential(4);
    return parseFloat(n.toFixed(6)).toString();
  }

  function update() {
    var value = parseFloat(valueInput.value);
    if (isNaN(value)) {
      result.textContent = 'Enter a valid number';
      allResults.textContent = '';
      return;
    }
    var converted = convert(currentCategory, value, fromUnit.value, toUnit.value);
    result.textContent = value + ' ' + fromUnit.value + ' = ' + formatNumber(converted) + ' ' + toUnit.value;

    var def = CATEGORIES[currentCategory];
    var lines = Object.keys(def.units).map(function (u) {
      var v = convert(currentCategory, value, fromUnit.value, u);
      return def.labels[u] + ' (' + u + '): ' + formatNumber(v);
    });
    allResults.textContent = lines.join('\n');
  }

  function setCategory(cat) {
    currentCategory = cat;
    Object.keys(catButtons).forEach(function (c) {
      catButtons[c].className = 'btn' + (c === cat ? '' : ' btn-outline');
    });
    populateUnits();
    update();
  }

  Object.keys(catButtons).forEach(function (c) {
    catButtons[c].addEventListener('click', function () { setCategory(c); });
  });

  swapBtn.addEventListener('click', function () {
    var tmp = fromUnit.selectedIndex;
    fromUnit.selectedIndex = toUnit.selectedIndex;
    toUnit.selectedIndex = tmp;
    update();
  });

  valueInput.addEventListener('input', update);
  fromUnit.addEventListener('change', update);
  toUnit.addEventListener('change', update);

  setCategory('length');
})();
</script>
